name: Deploy

on:
  push:
    branches:
      - main
      - feat/hosted-orvo-h400-deploy
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync Repository To Server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p /opt/orvo-h400/app"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '*.pem' \
            --exclude '*.private-key.pem' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/.svelte-kit' \
            --exclude 'frontend/build' \
            --exclude 'runtime' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/orvo-h400/app/"

      - name: Upload Environment Files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          ORVO_DEPLOY_ENV: ${{ secrets.ORVO_DEPLOY_ENV }}
          ORVO_BOOTSTRAP_NAME: ${{ secrets.ORVO_BOOTSTRAP_NAME }}
          ORVO_BOOTSTRAP_EMAIL: ${{ secrets.ORVO_BOOTSTRAP_EMAIL }}
          ORVO_BOOTSTRAP_PASSWORD: ${{ secrets.ORVO_BOOTSTRAP_PASSWORD }}
          ORVO_GITHUB_APP_PRIVATE_KEY_PEM: ${{ secrets.ORVO_GITHUB_APP_PRIVATE_KEY_PEM }}
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s\n' "$ORVO_DEPLOY_ENV" > "$tmpdir/.env.production"
          {
            printf 'ORVO_BOOTSTRAP_NAME=%q\n' "$ORVO_BOOTSTRAP_NAME"
            printf 'ORVO_BOOTSTRAP_EMAIL=%q\n' "$ORVO_BOOTSTRAP_EMAIL"
            printf 'ORVO_BOOTSTRAP_PASSWORD=%q\n' "$ORVO_BOOTSTRAP_PASSWORD"
          } > "$tmpdir/bootstrap.env"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p /opt/orvo-h400/app/runtime /opt/orvo/shared"
          scp "$tmpdir/.env.production" "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/orvo-h400/app/.env.production"
          scp "$tmpdir/bootstrap.env" "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/orvo-h400/app/runtime/bootstrap.env"
          if [ -n "$ORVO_GITHUB_APP_PRIVATE_KEY_PEM" ]; then
            printf '%s\n' "$ORVO_GITHUB_APP_PRIVATE_KEY_PEM" > "$tmpdir/github-app.pem"
            scp "$tmpdir/github-app.pem" "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/orvo-h400/app/runtime/github-app.pem"
            ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "chmod 644 /opt/orvo-h400/app/runtime/github-app.pem"
          fi

      - name: Deploy On Server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd /opt/orvo-h400/app && bash deploy/deploy.sh"
