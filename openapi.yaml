components:
  schemas:
    ApiKey:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
        last_used_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        organization_id:
          type: string
        revoked_at:
          format: date-time
          type:
            - string
            - "null"
      required:
        - id
        - organization_id
        - name
        - last_used_at
        - expires_at
        - created_at
        - revoked_at
      type: object
    CreateApiKeyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateApiKeyInputBody.json
          format: uri
          readOnly: true
          type: string
        expires_in:
          format: int64
          type: integer
        name:
          maxLength: 255
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateApiKeyOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateApiKeyOutputBody.json
          format: uri
          readOnly: true
          type: string
        api_key:
          $ref: "#/components/schemas/ApiKey"
        key:
          type: string
      required:
        - api_key
        - key
      type: object
    CreateOrganizationInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateOrganizationInputBody.json
          format: uri
          readOnly: true
          type: string
        logo:
          format: uri
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        set_as_active_organization:
          type: boolean
      required:
        - set_as_active_organization
        - name
      type: object
    CreateOrganizationOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateOrganizationOutputBody.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
      required:
        - id
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GetHistogramOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/GetHistogramOutputBody.json
          format: uri
          readOnly: true
          type: string
        buckets:
          items:
            $ref: "#/components/schemas/HistogramBucket"
          type:
            - array
            - "null"
      required:
        - buckets
      type: object
    GetServicesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/GetServicesOutputBody.json
          format: uri
          readOnly: true
          type: string
        services:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - services
      type: object
    GetSessionDataOutput_Organization:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        logo:
          type:
            - string
            - "null"
        member_role:
          type: string
        name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - member_role
        - id
        - name
        - logo
        - created_at
        - updated_at
      type: object
    GetSessionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/GetSessionOutputBody.json
          format: uri
          readOnly: true
          type: string
        active_organization:
          $ref: "#/components/schemas/GetSessionDataOutput_Organization"
        session:
          $ref: "#/components/schemas/Session"
        user:
          $ref: "#/components/schemas/User"
      required:
        - session
        - user
        - active_organization
      type: object
    HistogramBucket:
      additionalProperties: false
      properties:
        count:
          format: int64
          minimum: 0
          type: integer
        debug:
          format: int64
          minimum: 0
          type: integer
        error:
          format: int64
          minimum: 0
          type: integer
        fatal:
          format: int64
          minimum: 0
          type: integer
        info:
          format: int64
          minimum: 0
          type: integer
        time:
          format: date-time
          type: string
        warn:
          format: int64
          minimum: 0
          type: integer
      required:
        - time
        - count
        - debug
        - info
        - warn
        - error
        - fatal
      type: object
    ListApiKeysOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListApiKeysOutputBody.json
          format: uri
          readOnly: true
          type: string
        api_keys:
          items:
            $ref: "#/components/schemas/ApiKey"
          type:
            - array
            - "null"
      required:
        - api_keys
      type: object
    ListOrganizationsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListOrganizationsOutputBody.json
          format: uri
          readOnly: true
          type: string
        organizations:
          items:
            $ref: "#/components/schemas/Organization"
          type:
            - array
            - "null"
      required:
        - organizations
      type: object
    LogRecord:
      additionalProperties: false
      properties:
        body:
          type: string
        deployment_environment:
          type: string
        id:
          type: string
        log_attributes:
          additionalProperties:
            type: string
          type: object
        observed_timestamp:
          format: date-time
          type: string
        organization_id:
          type: string
        resource_attributes:
          additionalProperties:
            type: string
          type: object
        resource_schema_url:
          type: string
        scope_attributes:
          additionalProperties:
            type: string
          type: object
        scope_name:
          type: string
        scope_schema_url:
          type: string
        scope_version:
          type: string
        service_name:
          type: string
        severity_number:
          format: int32
          minimum: 0
          type: integer
        severity_text:
          type: string
        span_id:
          type: string
        timestamp:
          format: date-time
          type: string
        trace_flags:
          format: int32
          minimum: 0
          type: integer
        trace_id:
          type: string
      required:
        - id
        - timestamp
        - observed_timestamp
        - severity_number
        - severity_text
        - body
        - trace_id
        - span_id
        - trace_flags
        - resource_attributes
        - resource_schema_url
        - scope_name
        - scope_version
        - scope_attributes
        - scope_schema_url
        - log_attributes
        - service_name
        - deployment_environment
        - organization_id
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/LoginInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          format: email
          type: string
        password:
          maxLength: 72
          minLength: 8
          type: string
      required:
        - email
        - password
      type: object
    Organization:
      additionalProperties: false
      properties:
        created_at:
          type: string
        id:
          type: string
        logo:
          type:
            - string
            - "null"
        name:
          type: string
        role:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug
        - logo
        - role
        - created_at
      type: object
    QueryLogsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/QueryLogsOutputBody.json
          format: uri
          readOnly: true
          type: string
        logs:
          items:
            $ref: "#/components/schemas/LogRecord"
          type:
            - array
            - "null"
        next_cursor:
          format: date-time
          type: string
      required:
        - logs
      type: object
    RegisterInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/RegisterInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          format: email
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        password:
          maxLength: 72
          minLength: 8
          type: string
      required:
        - email
        - password
        - name
      type: object
    Session:
      additionalProperties: false
      properties:
        active_organization_id:
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        ip_address:
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
        user_agent:
          type:
            - string
            - "null"
        user_id:
          type: string
      required:
        - id
        - user_id
        - active_organization_id
        - ip_address
        - user_agent
        - expires_at
        - created_at
        - updated_at
      type: object
    SetActiveOrganizationInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/SetActiveOrganizationInputBody.json
          format: uri
          readOnly: true
          type: string
        organization_id:
          type:
            - string
            - "null"
      required:
        - organization_id
      type: object
    User:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        id:
          type: string
        image:
          type:
            - string
            - "null"
        name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - email
        - email_verified
        - name
        - image
        - created_at
        - updated_at
      type: object
  securitySchemes:
    bearerAuth:
      in: cookie
      name: orvo_sess
      type: apiKey
info:
  title: Orvo API
  version: 1.0.0
openapi: 3.1.0
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - auth
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - auth
  /auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInputBody"
        required: true
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - auth
  /auth/session:
    get:
      operationId: get-session
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSessionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - auth
  /auth/session/active-organization:
    post:
      operationId: set-active-organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveOrganizationInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - auth
  /organizations:
    get:
      operationId: list-organizations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOrganizationsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - organizations
    post:
      operationId: create-organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrganizationOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - organizations
  /organizations/{organization_id}/api-keys:
    get:
      operationId: list-api-keys
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListApiKeysOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - api-keys
    post:
      operationId: create-api-key
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiKeyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - api-keys
  /organizations/{organization_id}/api-keys/{key_id}:
    delete:
      operationId: revoke-api-key
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
        - in: path
          name: key_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - api-keys
  /organizations/{organization_id}/logs:
    get:
      operationId: query-logs
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
        - description: Start time (RFC3339)
          explode: false
          in: query
          name: start
          schema:
            description: Start time (RFC3339)
            type: string
        - description: End time (RFC3339)
          explode: false
          in: query
          name: end
          schema:
            description: End time (RFC3339)
            type: string
        - description: Max results to return (default 100, max 1000)
          explode: false
          in: query
          name: limit
          schema:
            description: Max results to return (default 100, max 1000)
            format: int64
            type: integer
        - description: Pagination cursor (RFC3339Nano timestamp)
          explode: false
          in: query
          name: cursor
          schema:
            description: Pagination cursor (RFC3339Nano timestamp)
            type: string
        - description: Full-text search on log body
          explode: false
          in: query
          name: search
          schema:
            description: Full-text search on log body
            type: string
        - description: Filter by service name (comma-separated)
          explode: false
          in: query
          name: service
          schema:
            description: Filter by service name (comma-separated)
            type: string
        - description: "Filter by severity (comma-separated: debug,info,warn,error,fatal)"
          explode: false
          in: query
          name: severity
          schema:
            description: "Filter by severity (comma-separated: debug,info,warn,error,fatal)"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryLogsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - logs
  /organizations/{organization_id}/logs/histogram:
    get:
      operationId: get-log-histogram
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
        - description: Start time (RFC3339)
          explode: false
          in: query
          name: start
          schema:
            description: Start time (RFC3339)
            type: string
        - description: End time (RFC3339)
          explode: false
          in: query
          name: end
          schema:
            description: End time (RFC3339)
            type: string
        - description: Bucket interval (1m, 5m, 15m, 30m, 1h, 6h, 12h, 1d)
          explode: false
          in: query
          name: interval
          schema:
            description: Bucket interval (1m, 5m, 15m, 30m, 1h, 6h, 12h, 1d)
            type: string
        - description: Full-text search on log body
          explode: false
          in: query
          name: search
          schema:
            description: Full-text search on log body
            type: string
        - description: Filter by service name (comma-separated)
          explode: false
          in: query
          name: service
          schema:
            description: Filter by service name (comma-separated)
            type: string
        - description: Filter by severity (comma-separated)
          explode: false
          in: query
          name: severity
          schema:
            description: Filter by severity (comma-separated)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHistogramOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - logs
  /organizations/{organization_id}/logs/services:
    get:
      operationId: get-log-services
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetServicesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - logs
servers:
  - url: /api/v1

