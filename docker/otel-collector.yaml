extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  hostmetrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      filesystem:
        include_virtual_filesystems: false
        metrics:
          system.filesystem.utilization:
            enabled: true
      load: {}
      network: {}
      paging:
        metrics:
          system.paging.utilization:
            enabled: true
      system:
        metrics:
          system.uptime:
            enabled: true

  postgresql:
    endpoint: orvo-postgres:5432
    transport: tcp
    username: ${env:POSTGRES_USER}
    password: ${env:POSTGRES_PASSWORD}
    databases:
      - ${env:POSTGRES_DB}
    collection_interval: 30s
    tls:
      insecure: true

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  resourcedetection/system:
    detectors: [system]
    system:
      hostname_sources: [os]

  resource/host:
    attributes:
      - action: upsert
        key: host.name
        value: ${env:HOST_IDENTIFIER}
      - action: upsert
        key: service.name
        value: orvo-host-observer
      - action: upsert
        key: deployment.environment
        value: production

  resource/postgresql:
    attributes:
      - action: upsert
        key: host.name
        value: ${env:HOST_IDENTIFIER}
      - action: upsert
        key: service.name
        value: orvo-postgres
      - action: upsert
        key: deployment.environment
        value: production

exporters:
  otlphttp/orvo:
    endpoint: http://orvo-app:4318
    headers:
      x-api-key: ${env:ORVO_OTEL_API_KEY}

service:
  extensions: [health_check]
  pipelines:
    metrics/host:
      receivers: [hostmetrics]
      processors: [resourcedetection/system, resource/host, batch]
      exporters: [otlphttp/orvo]
    metrics/postgresql:
      receivers: [postgresql]
      processors: [resourcedetection/system, resource/postgresql, batch]
      exporters: [otlphttp/orvo]
